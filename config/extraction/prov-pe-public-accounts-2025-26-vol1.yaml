# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: prov-pe-public-accounts-2025-26-vol1
notes: Prince Edward Island Public Accounts 2025-26 Volume I. Amortization is reported as its own expense line, not allocated to departments.
  Schedule numbers print at the left of each line.
tables:
- table_id: statement-of-operations-expense
  title: 'Consolidated Statement of Operations: Expenses'
  role: function_breakdown
  method: pdfplumber_words
  units:
    scale: 1000
    currency: CAD
    as_printed: ($000)
  scope: consolidated_summary
  columns:
    budget_2025_26: &id001
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26: &id002
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25: &id003
      fiscal_year: 2024-2025
      basis: actual
  parts:
  - page: 48
    printed_page: '38'
    start_after: ^EXPENSES$
    end_at: ^Total Expenses
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Agriculture
  - label: Economic Development, Innovation and Trade
  - label: Education and Early Years
  - label: Environment, Energy and Climate Action
  - label: Executive Council
  - label: Finance
  - label: Fisheries, Tourism, Sport and Culture
  - label: Health and Wellness
  - label: Housing, Land and Communities
  - label: Justice and Public Safety
  - label: Legislative Assembly
  - label: Public Service Commission
  - label: Social Development and Seniors
  - label: Transportation and Infrastructure
  - label: Workforce, Advanced Learning and Population
  - label: Total Program Expenses
    kind: subtotal
  - label: Interest Charges on Debt
  - label: Interest Charges on Capital Obligations
  - label: Amortization of Tangible Capital Assets
  - label: Accretion Expense
  - label: Total Expenses
    kind: total
  checks:
  - type: rows_sum
    equals: Total Expenses
    tolerance: 3
- table_id: change-in-net-debt-amortization
  title: 'Consolidated Statement of Changes in Net Debt: amortization'
  role: object_breakdown
  method: pdfplumber_words
  units:
    scale: 1000
    currency: CAD
    as_printed: ($000)
  scope: consolidated_summary
  columns:
    budget_2025_26: *id001
    actual_2025_26: *id002
    actual_2024_25: *id003
  parts:
  - page: 49
    printed_page: '39'
    start_after: Acquisition of Tangible
    end_at: Amortization of Tangible
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Amortization of Tangible Capital Assets
