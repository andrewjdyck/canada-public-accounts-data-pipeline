# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: prov-nl-public-accounts-2025-26
notes: Newfoundland and Labrador Consolidated Summary Financial Statements 2025-26. The Statement of Operations shows only three sectors, so Schedule
  12 (by department) is the function table.
tables:
- table_id: expenses-by-department
  title: 'Schedule 12: Expenses by Department'
  role: function_breakdown
  method: pdfplumber_words
  units:
    scale: 1000
    currency: CAD
    as_printed: $000
  scope: consolidated_summary
  columns:
    budget_2025_26: &id001
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26: &id002
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25: &id003
      fiscal_year: 2024-2025
      basis: actual
  parts:
  - page: 129
    printed_page: '124'
    start_after: ^\(\$000\)
    end_at: '^Total: Expenses by Department'
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Consolidated Fund Services
  - label: Executive Council
  - label: Finance
  - label: Public Procurement Agency
  - label: Public Service Commission
  - label: Government Services
  - label: Transportation and Infrastructure
  - label: Labrador Affairs
  - label: Legislature
  - label: General Government Sector and Legislative Branch
    kind: subtotal
    unlabelled: true
  - label: Environment, Conservation and Climate Change
  - label: Energy and Mines
  - label: Tourism, Culture, Arts and Recreation
  - label: Forestry, Agriculture and Lands
  - label: Jobs, Growth and Rural Development
  - label: Fisheries and Aquaculture
  - label: Resource Sector
    kind: subtotal
    unlabelled: true
  - label: Social Supports and Well-Being
  - label: Education and Early Childhood Development
  - label: Health and Community Services
  - label: Justice and Public Safety
  - label: Newfoundland and Labrador Housing Corporation
  - label: Municipal and Community Affairs
  - label: Seniors
  - label: Social Sector
    kind: subtotal
    unlabelled: true
  - label: 'Total: Expenses by Department'
    kind: total
  checks:
  - type: rows_sum
    equals: 'Total: Expenses by Department'
    tolerance: 3
- table_id: change-in-net-debt-amortization
  title: 'Consolidated Statement of Change in Net Debt: amortization'
  role: object_breakdown
  method: pdfplumber_words
  units:
    scale: 1000
    currency: CAD
    as_printed: $000
  scope: consolidated_summary
  columns:
    budget_2025_26: *id001
    actual_2025_26: *id002
    actual_2024_25: *id003
  parts:
  - page: 71
    printed_page: '66'
    start_after: ^Net book value of tangible capital asset disposals
    end_at: ^Amortization of purchased intangibles
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Amortization of tangible capital assets
    sign: -1
  - label: Increase (Decrease) in net book value of tangible capital assets
    kind: memo
  - label: Acquisition of purchased intangibles
    kind: memo
  - label: Amortization of purchased intangibles
    sign: -1
