# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: prov-qc-public-accounts-2025-26-vol1
notes: Quebec Public Accounts 2025-2026 Volume 1 (English edition; portfolio names stay in French). Spaces as thousands separators. Depreciation
  is in operating expenditure (Note 5). Appendix 2 (by portfolio) is the function table; the Statement of Operations is kept for cross-checks.
tables:
- table_id: statement-of-operations-expenditure
  title: 'Consolidated statement of operations: Expenditure'
  role: headline
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: millions of dollars
  scope: consolidated_summary
  space_thousands: true
  ignore_unaligned_numbers: true
  columns:
    budget_2025_26: &id001
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26: &id002
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25: &id003
      fiscal_year: 2024-2025
      basis: actual
  parts:
  - page: 95
    printed_page: '88'
    start_after: ^EXPENDITURE
    end_at: ^Total expenditure
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Santé et Services sociaux
  - label: Éducation
  - label: Enseignement supérieur
  - label: Famille
  - label: Transports et Mobilité durable
  - label: Emploi et Solidarité sociale
  - label: Affaires municipales et Habitation
  - label: Économie, Innovation et Énergie
  - label: Environnement, Lutte contre les changements climatiques, Faune et Parcs
  - label: Other portfolios
  - label: Portfolio expenditure
    kind: subtotal
  - label: Debt service
  - label: Total expenditure
    kind: total
  checks:
  - type: rows_sum
    equals: Total expenditure
    tolerance: 3
- table_id: change-in-net-debt-depreciation
  title: 'Consolidated statement of change in net debt: depreciation'
  role: object_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: millions of dollars
  scope: consolidated_summary
  space_thousands: true
  columns:
    budget_2025_26: *id001
    actual_2025_26: *id002
    actual_2024_25: *id003
  parts:
  - page: 97
    printed_page: '90'
    start_after: ^Acquisition and work in progress
    end_at: ^Depreciation
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Depreciation
- table_id: expenditure-by-portfolio
  title: 'Appendix 2: Consolidated statement of expenditure by portfolio and type'
  role: function_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: millions of dollars
  scope: consolidated_summary
  space_thousands: true
  columns:
    transfers_2025_26:
      fiscal_year: 2025-2026
      basis: actual
      object: Transfers
      kind: memo
    remuneration_2025_26:
      fiscal_year: 2025-2026
      basis: actual
      object: Remuneration
      kind: memo
    operating_2025_26:
      fiscal_year: 2025-2026
      basis: actual
      object: Operating
      kind: memo
    doubtful_2025_26:
      fiscal_year: 2025-2026
      basis: actual
      object: Doubtful accounts and losses
      kind: memo
    total_2025_26:
      fiscal_year: 2025-2026
      basis: actual
      object: Total
      kind: detail
    transfers_2024_25:
      fiscal_year: 2024-2025
      basis: actual
      object: Transfers
      kind: memo
    remuneration_2024_25:
      fiscal_year: 2024-2025
      basis: actual
      object: Remuneration
      kind: memo
    operating_2024_25:
      fiscal_year: 2024-2025
      basis: actual
      object: Operating
      kind: memo
    doubtful_2024_25:
      fiscal_year: 2024-2025
      basis: actual
      object: Doubtful accounts and losses
      kind: memo
    total_2024_25:
      fiscal_year: 2024-2025
      basis: actual
      object: Total
      kind: detail
  parts:
  - page: 199
    start_after: ^PORTFOLIOS$
    end_at: ^Total expenditure
    columns:
    - transfers_2025_26
    - remuneration_2025_26
    - operating_2025_26
    - doubtful_2025_26
    - total_2025_26
  - page: 200
    start_after: ^PORTFOLIOS$
    end_at: ^Total expenditure
    columns:
    - transfers_2024_25
    - remuneration_2024_25
    - operating_2024_25
    - doubtful_2024_25
    - total_2024_25
  rows:
  - label: Assemblée nationale
  - label: Personnes désignées par l’Assemblée nationale
  - label: Affaires municipales et Habitation
