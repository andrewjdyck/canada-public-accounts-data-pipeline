# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: prov-mb-public-accounts-2025-26
notes: Manitoba Annual Report and Public Accounts 2025-26. Dot leaders and split digits; the 2024-25 column is restated for comparability (Schedule
  10, Note 22).
tables:
- table_id: statement-of-operations-expense
  title: 'Consolidated Statement of Operations: Expenses'
  role: function_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: $ millions
  scope: consolidated_summary
  drop_chars:
  - .
  x_tolerance: 3
  merge_split_digits: true
  columns:
    budget_2025_26: &id001
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26: &id002
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25: &id003
      fiscal_year: 2024-2025
      basis: actual_restated
  parts:
  - page: 71
    printed_page: '69'
    start_after: ^EXPENSES$
    end_at: ^Total Expenses
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Legislative Assembly
  - label: Executive Council
  - label: Advanced Education and Training
  - label: Agriculture
  - label: Business, Mining, Trade and Job Creation
  - label: Education and Early Childhood Learning
  - label: Environment and Climate Change
  - label: Families
  - label: Finance
  - label: Health, Seniors and Long-Term Care
  - label: Housing, Addictions and Homelessness
  - label: Innovation and New Technology
  - label: Justice
  - label: Labour and Immigration
  - label: Municipal and Northern Relations
  - label: Natural Resources and Indigenous Futures
  - label: Public Service Commission
  - label: Public Service Delivery
  - label: Sport, Culture, Heritage and Tourism
  - label: Transportation and Infrastructure
  - label: Enabling appropriations
  - label: Emergency expenditures
  - label: Tax credits
  - label: Debt servicing
  - label: Tobacco settlement
  - label: Total Expenses
    kind: total
  checks:
  - type: rows_sum
    equals: Total Expenses
    tolerance: 3
- table_id: change-in-net-debt-amortization
  title: 'Consolidated Statement of Change in Net Debt: amortization'
  role: object_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: $ millions
  scope: consolidated_summary
  drop_chars:
  - .
  x_tolerance: 3
  merge_split_digits: true
  columns:
    budget_2025_26: *id001
    actual_2025_26: *id002
    actual_2024_25: *id003
  parts:
  - page: 74
    printed_page: '72'
    start_after: ^Acquisition of tangible
    end_at: ^Amortization of tangible
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Amortization of tangible capital assets
