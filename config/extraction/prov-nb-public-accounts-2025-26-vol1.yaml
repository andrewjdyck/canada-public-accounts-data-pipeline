# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: prov-nb-public-accounts-2025-26-vol1
notes: New Brunswick Public Accounts 2026 Volume 1. A Note/Schedule reference column sits left of the amounts.
tables:
- table_id: statement-of-operations-expense
  title: 'Consolidated Statement of Operations: Expense'
  role: function_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: millions
  scope: consolidated_summary
  ignore_unaligned_numbers: true
  columns:
    budget_2025_26: &id001
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26: &id002
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25: &id003
      fiscal_year: 2024-2025
      basis: actual
  parts:
  - page: 38
    printed_page: '34'
    start_after: ^EXPENSE$
    end_at: ^\(?[\d,.]+\)? \(?[\d,.]+\)? \(?[\d,.]+\)?$
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Education and Training
  - label: Health
  - label: Social Development
  - label: Protection Services
  - label: Economic Development
  - label: Labour and Employment
  - label: Resources
  - label: Transportation and Infrastructure
  - label: Central Government
  - label: Service of the Public Debt
  - label: Total expense
    kind: total
    unlabelled: true
  checks:
  - type: rows_sum
    equals: Total expense
    tolerance: 0.3
- table_id: change-in-net-debt-amortization
  title: 'Consolidated Statement of Change in Net Debt: amortization'
  role: object_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: millions
  scope: consolidated_summary
  columns:
    budget_2025_26: *id001
    actual_2025_26: *id002
    actual_2024_25: *id003
  parts:
  - page: 40
    printed_page: '36'
    start_after: ^Acquisition of Tangible
    end_at: ^Amortization of Tangible
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Amortization of Tangible Capital Assets
- table_id: schedule-24-central-government
  title: 'Schedule 24: Central Government'
  role: headline
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: millions
  scope: consolidated_summary
  merge_split_digits: true
  columns:
    budget_2025_26:
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26:
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25:
      fiscal_year: 2024-2025
      basis: actual
  parts:
  - page: 97
    printed_page: '93'
    start_after: ^CENTRAL GOVERNMENT$
    end_at: ^\$ [\d,.]+ \$
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Service New Brunswick
  - label: Pension Expense
  - label: Local Government
  - label: New Brunswick Residential Electricity Rebate
  - label: Revenue Sharing Agreements with First Nations
  - label: Enterprise Resource Planning
  - label: General Government
  - label: Injured Workers Liability Accrual
  - label: Canada Pension Plan Employer Contributions
  - label: Retirement Allowance
  - label: Legislative Assembly
  - label: Finance and Treasury Board
  - label: Financial and Consumer Services Commission
  - label: Executive Council
  - label: Amortization Expense
  - label: New Brunswick Lotteries and Gaming Corporation
  - label: Office of the Premier
  - label: Provision Expense
  - label: Total Central Government
    kind: total
    unlabelled: true
  checks:
  - type: rows_sum
    equals: Total Central Government
    tolerance: 0.3
cross_checks:
- left:
    table: schedule-24-central-government
    row: Total Central Government
    column: budget_2025_26
  right:
    table: statement-of-operations-expense
    row: Central Government
    column: budget_2025_26
  tolerance: 0.1
- left:
    table: schedule-24-central-government
    row: Total Central Government
    column: actual_2025_26
  right:
    table: statement-of-operations-expense
    row: Central Government
    column: actual_2025_26
  tolerance: 0.1
- left:
    table: schedule-24-central-government
    row: Total Central Government
    column: actual_2024_25
  right:
    table: statement-of-operations-expense
    row: Central Government
    column: actual_2024_25
  tolerance: 0.1
