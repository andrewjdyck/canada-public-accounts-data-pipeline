# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: prov-bc-public-accounts-2025-26
notes: BC Public Accounts 2025-26, Summary Financial Statements. Dot leaders are interleaved with the text, hence drop_chars.
tables:
- table_id: statement-of-operations-expense
  title: 'Consolidated Statement of Operations: Expense'
  role: function_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: In Millions
  scope: consolidated_summary
  drop_chars:
  - .
  x_tolerance: 3
  columns:
    budget_2025_26:
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26: &id001
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25: &id002
      fiscal_year: 2024-2025
      basis: actual
  parts:
  - page: 44
    printed_page: '42'
    start_after: ^Expense\(Note 31\)
    end_at: ^[\d,]+ [\d,]+ [\d,]+$
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Health
  - label: Education
  - label: Social services
  - label: Other
  - label: Interest
  - label: Natural resources and economic development
  - label: Transportation
  - label: Protection of persons and property
  - label: General government
  - label: Total expense
    kind: total
    unlabelled: true
  checks:
  - type: rows_sum
    equals: Total expense
    tolerance: 3
- table_id: expense-by-object
  title: 'Note 31: Total Expense by Group Account Classification'
  role: object_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: In Millions
  scope: consolidated_summary
  drop_chars:
  - .
  x_tolerance: 3
  columns:
    actual_2025_26: *id001
    actual_2024_25: *id002
  parts:
  - page: 87
    printed_page: '85'
    start_after: ^Total Expense by Group Account
    end_at: ^[\d,]+ [\d,]+$
    columns:
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Salaries and benefits
  - label: Government transfers
  - label: Operating costs
  - label: Interest
  - label: Amortization
  - label: Other
  - label: Total expense
    kind: total
    unlabelled: true
  checks:
  - type: rows_sum
    equals: Total expense
    tolerance: 3
cross_checks:
- left:
    table: expense-by-object
    row: Total expense
    column: actual_2025_26
  right:
    table: statement-of-operations-expense
    row: Total expense
    column: actual_2025_26
- left:
    table: expense-by-object
    row: Total expense
    column: actual_2024_25
  right:
    table: statement-of-operations-expense
    row: Total expense
    column: actual_2024_25
