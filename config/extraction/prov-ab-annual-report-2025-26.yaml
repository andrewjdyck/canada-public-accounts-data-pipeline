# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: prov-ab-annual-report-2025-26
notes: Alberta 2025-26 Annual Report. Amounts print with split digits ('3 0,465'), hence merge_split_digits. Schedule 3 (expense by object by
  ministry) is printed rotated, so amortization comes from the Statement of Change in Net Debt.
tables:
- table_id: statement-of-operations-expense
  title: 'Consolidated Statement of Operations: Expenses by function'
  role: function_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: In millions
  scope: consolidated_summary
  merge_split_digits: true
  x_tolerance: 4
  columns:
    budget_2025_26: &id001
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26: &id002
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25: &id003
      fiscal_year: 2024-2025
      basis: actual
  parts:
  - page: 28
    printed_page: '26'
    start_after: ^Expenses by function
    end_at: ^[\d,]+ [\d,]+ [\d,]+$
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Health
  - label: Education
  - label: Social services
  - label: General government
  - label: Agriculture, resource management and economic development
  - label: Protection of persons and property
  - label: Transportation, communications and utilities
  - label: Regional planning and development
  - label: Environment
  - label: Housing
  - label: Recreation and culture
  - label: Debt servicing costs
  - label: Pension recovery
  - label: Total expense
    kind: total
    unlabelled: true
  checks:
  - type: rows_sum
    equals: Total expense
    tolerance: 3
- table_id: change-in-net-debt-amortization
  title: 'Consolidated Statement of Change in Net Debt: amortization'
  role: object_breakdown
  method: pdfplumber_words
  units:
    scale: 1000000
    currency: CAD
    as_printed: In millions
  scope: consolidated_summary
  merge_split_digits: true
  x_tolerance: 4
  columns:
    budget_2025_26: *id001
    actual_2025_26: *id002
    actual_2024_25: *id003
  parts:
  - page: 31
    printed_page: '29'
    start_after: ^Cash requirement adjustment
    end_at: ^Amortization of tangible
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Amortization of tangible capital assets and purchased intangibles
