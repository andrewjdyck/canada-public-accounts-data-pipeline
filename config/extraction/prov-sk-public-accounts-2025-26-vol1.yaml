# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: prov-sk-public-accounts-2025-26-vol1
notes: Saskatchewan Public Accounts 2025-26 Volume 1, Summary Financial Statements.
tables:
- table_id: statement-of-operations-expense
  title: 'Statement of Operations: Expense'
  role: function_breakdown
  method: pdfplumber_words
  units:
    scale: 1000
    currency: CAD
    as_printed: thousands of dollars
  scope: consolidated_summary
  columns:
    budget_2025_26: &id001
      fiscal_year: 2025-2026
      basis: budget
    actual_2025_26: &id002
      fiscal_year: 2025-2026
      basis: actual
    actual_2024_25: &id003
      fiscal_year: 2024-2025
      basis: actual
  parts:
  - page: 47
    printed_page: '46'
    start_after: ^Expense$
    end_at: ^Total Expense
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Health
  - label: Education
  - label: Social services and assistance
  - label: Protection of persons and property
  - label: Agriculture
  - label: Financing charges
  - label: Community development
  - label: Transportation
  - label: General government
  - label: Economic development
  - label: Environment and natural resources
  - label: Total Expense
    kind: total
  checks:
  - type: rows_sum
    equals: Total Expense
    tolerance: 3
- table_id: change-in-net-debt-amortization
  title: 'Statement of Change in Net Debt: amortization'
  role: object_breakdown
  method: pdfplumber_words
  units:
    scale: 1000
    currency: CAD
    as_printed: thousands of dollars
  scope: consolidated_summary
  columns:
    budget_2025_26: *id001
    actual_2025_26: *id002
    actual_2024_25: *id003
  parts:
  - page: 49
    printed_page: '48'
    start_after: ^Acquisitions
    end_at: ^Amortization
    columns:
    - budget_2025_26
    - actual_2025_26
    - actual_2024_25
  rows:
  - label: Amortization
