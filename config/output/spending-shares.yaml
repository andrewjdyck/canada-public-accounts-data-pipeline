# Output contract settings for data/3_gold/spending-shares/<fiscal-year>.yaml (PLAN.md "Output Contract").
# Hand-written. Read by src/publish/build_spending_shares.py.
# Categories are services (config/taxonomy/services.csv), in that file's order; see README "Principles".
schemaVersion: 1
dataset: canada-spending-shares
fiscalYear: "2025-26"
fiscal_year_key: "2025-2026"   # fiscal_year as stored in gold
basis: actual

federal:
  # Shares come from data/3_gold/federal-leaves.csv (src/clean/build_federal_leaves.py).
  # Leaves are configured in config/federal/leaves.csv and config/federal/ministry-services.csv.
  doc_id: fed-canada-public-accounts-2025-26-vol1

provincial:
  # Shares come from gold facts (function_breakdown tables) mapped COFOG -> service.
  # Municipal Transfers = lines in config/output/category-overrides.csv: provincial transfers to
  # municipalities whose use is unknown (README "Principles" 3). Counted in numerator and denominator.
  # Denominator = the statement's total expense.
