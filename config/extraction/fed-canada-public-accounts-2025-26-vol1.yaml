# Extraction spec (hand-written). Schema: config/extraction.schema.json
doc_id: fed-canada-public-accounts-2025-26-vol1
notes: Public Accounts of Canada 2025-2026 Volume I, Note 6. Segments are ministries; comparatives reclassified to the current presentation.
